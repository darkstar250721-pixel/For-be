<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Bé ❤️</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #000000, #1a0000);
  color: #ff99cc;
  font-family: Arial, sans-serif;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Container */
.container {
  text-align: center;
  padding: 20px;
  max-width: 90%;
  animation: fadeIn 2s ease-in-out;
}

/* Tiêu đề responsive */
h1 {
  font-size: clamp(24px, 6vw, 42px);
  margin-bottom: 10px;
}

/* Nội dung responsive */
.message {
  font-size: clamp(14px, 4vw, 20px);
  line-height: 1.5;
  opacity: 0;
  animation: showText 3s forwards;
}

/* Tim chính */
.heart {
  font-size: clamp(40px, 10vw, 70px);
  margin-top: 20px;
  animation: beat 1s infinite;
}

/* Tim bay */
.floating-heart {
  position: absolute;
  color: pink;
  pointer-events: none;
  animation: floatUp linear infinite;
  opacity: 0.8;
}

/* Animations */
@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes showText {
  to { opacity: 1; }
}

@keyframes floatUp {
  0% {
    transform: translateY(100vh);
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh);
    opacity: 0;
  }
}

/* Tối ưu riêng cho mobile nhỏ */
@media (max-width: 480px) {
  .container {
    padding: 15px;
  }

  .message {
    margin-top: 10px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Chúc bé học ngoan ❤️</h1>

  <div class="message">
    Mong bé luôn vui vẻ, học giỏi và gặp thật nhiều may mắn 🍀<br>
    Có anh luôn ở đây ủng hộ bé mỗi ngày 😚
  </div>

  <div class="heart">💖</div>
</div>

<script>
// Tim bay tối ưu (ít lag hơn)
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.innerHTML = "💗";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (12 + Math.random() * 25) + "px";
  heart.style.animationDuration = (4 + Math.random() * 2) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}

// Giảm tần suất để mượt mobile
setInterval(createHeart, 400);
</script>

</body>
</html>
