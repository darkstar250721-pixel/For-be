<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>For Bé ❤️</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #000000, #1a0000);
  color: #ff99cc;
  font-family: Arial, sans-serif;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Container giữa màn hình */
.container {
  text-align: center;
  animation: fadeIn 2s ease-in-out;
}

/* Tiêu đề */
h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

/* Nội dung */
.message {
  font-size: 20px;
  opacity: 0;
  animation: showText 3s forwards;
}

/* Tim chính */
.heart {
  font-size: 70px;
  margin-top: 25px;
  animation: beat 1s infinite;
}

/* Tim bay */
.floating-heart {
  position: absolute;
  color: pink;
  animation: floatUp linear infinite;
  pointer-events: none;
}

/* Animations */
@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes showText {
  to { opacity: 1; }
}

@keyframes floatUp {
  0% {
    transform: translateY(100vh);
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Chúc bé học ngoan ❤️</h1>

  <div class="message">
    Mong bé luôn vui vẻ, học giỏi và gặp thật nhiều may mắn 🍀<br>
    Có anh luôn ở đây ủng hộ bé mỗi ngày 😚
  </div>

  <div class="heart">💖</div>
</div>

<script>
// tạo tim bay random
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.innerHTML = "💗";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 35) + "px";
  heart.style.animationDuration = (3 + Math.random() * 3) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 250);
</script>

</body>
</html>
