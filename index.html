<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>For Bé ❤️</title>
  <style>
    body {
      background: black;
      color: pink;
      text-align: center;
      font-family: Arial;
    }
    .heart {
      font-size: 50px;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Chúc bé học ngoan ❤️</h1>
  <div class="heart">💗💗💗</div>

</body>
</html>
