<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>For Bé ❤️</title>

<style>
body {
  background: radial-gradient(circle, #000000, #1a0000);
  color: #ff99cc;
  text-align: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* Tiêu đề */
h1 {
  margin-top: 80px;
  font-size: 40px;
  animation: fadeIn 2s ease-in-out;
}

/* Chữ chúc */
.message {
  font-size: 20px;
  margin-top: 20px;
  opacity: 0;
  animation: showText 4s forwards;
}

/* Trái tim lớn */
.heart {
  font-size: 60px;
  margin-top: 30px;
  animation: beat 1s infinite;
}

/* Tim bay */
.floating-heart {
  position: absolute;
  color: pink;
  animation: floatUp 5s linear infinite;
}

/* Animations */
@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes showText {
  to { opacity: 1; }
}

@keyframes floatUp {
  0% {
    transform: translateY(100vh);
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<h1>Chúc bé học ngoan ❤️</h1>

<div class="message">
  Mong bé luôn vui vẻ, học giỏi và gặp thật nhiều may mắn 🍀<br>
  Có anh luôn đứng phía sau ủng hộ bé nè 😚
</div>

<div class="heart">💖</div>

<script>
// Tạo tim bay random
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.innerHTML = "💗";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (20 + Math.random() * 30) + "px";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
